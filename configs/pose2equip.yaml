# hydra config
hydra:
  run:
    dir: ${log_path} # the log path, used for log and checkpoint
  sweep:
    dir: logs/
    subdir: ${experiment}/${now:%Y-%m-%d}/${now:%H-%M-%S}

loss:
  lr: 0.001
  weight_decay: 0.01

data:
  raw:
    root_path: /home/kaixu_chen/skiing/data
    video_path: ${data.raw.root_path}/raw_data
    sam_3d_body_results_path: ${data.raw.root_path}/sam3d_body_results/person # 没有标签的训练数据
    sam3_results_path: ${data.raw.root_path}/sam3_results/person # 没有标签的训练数据

  unity:
    root_path: /home/kaixu_chen/skiing/data/skiing_unity_dataset
    data_path: ${data.unity.root_path}/data_pole_ski
    sam_3d_body_results_path: ${data.unity.root_path}/sam3d_body_results/inference # 有标签的训练数据
    sam3_results_path: ${data.unity.root_path}/sam3_results/inference # 只有2d标签的训练数据

  index_mapping: ${data.unity.root_path}/index_mapping # precomputed index mapping directory
  # index_mapping_file: camera_pairs_by_action.json # precomputed index mapping json file name
  index_mapping_path: ${data.index_mapping}/use_layer_camera_filter_disabled/camera_pairs_by_action_folds # must match existing generated fold files
  sam3d_export_path: ${data.unity.root_path}/sam3d_body_results/modalities_from_sam3d # exported kpt2d/kpt3d from SAM3D

  img_size: 224

  load_frames: false # stgcn only needs 3D keypoints; set true for pose2equip/3dcnn
  load_2d_kpt: false # whether to load 2d keypoints
  load_3d_kpt: true
  load_mask: false
  human_3d_source: unity # unity | sam3d; selects body input for equipment models
  sam3d_human_key: character_cam1 # key under batch["kpt3d_sam"] when human_3d_source=sam3d

  time_window: 16

  num_workers: 16
  batch_size: 16

model:
  backbone: stgcn # pose2equip, stgcn, mlp, tcn, skeleton_transformer, stgcn_query, 3dcnn

train:
  # Training config
  max_epochs: 50 # numer of epochs of training

  gpu: 0 # choices=[0, 1], help='the gpu number whicht to train'
  fold: 0 # the fold number for cross validation

trainer:
  accelerator: auto
  devices: auto
  test_ckpt_path: best
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  num_sanity_val_steps: 2

# Shared model/loss settings for pose2equip and skeleton backbones
pose2equip:
  num_joints: 15
  dino_model_name: facebook/dinov2-base
  dino_freeze: true
  dino_image_size: 224
  hidden_dim: 256 # shared by pose and skeleton backbones
  num_equip_kpts: 8
  backbone_layers: 3
  decoder_layers: 3
  num_heads: 8
  dropout: 0.1
  tcn_kernel_size: 5

  loss_w_sym: 0.03
  loss_w_len_abs: 0.2
  loss_w_temporal_smooth: 0.02
  predict_anchor_offsets: true
  loss_w_dino_feat: 0.1

  # 这里应该是过滤之后的idx
  left_ankle_idx: 10
  right_ankle_idx: 11
  left_wrist_idx: 12
  right_wrist_idx: 13
  left_foot_idx: 10
  right_foot_idx: 11
  left_hand_idx: 13
  right_hand_idx: 12

  # GT点索引，应该和unity记录的GT点顺序一致，或者至少保证能正确选取对应的点进行训练
  ski_gt_idx: [1, 2, 4, 5] # ski_l_front, ski_l_back, ski_r_front, ski_r_back
  pole_gt_idx: [0, 1, 2, 3] # pole_l_handle, pole_l_tip, pole_r_handle, pole_r_tip

# Experiment identity. Override experiment_tag from CLI for a custom matrix cell name.
experiment_tag: ${model.backbone}__pose-${data.human_3d_source}__h${pose2equip.hidden_dim}__bl${pose2equip.backbone_layers}__dl${pose2equip.decoder_layers}__heads${pose2equip.num_heads}__tw${data.time_window}__frames-${data.load_frames}
experiment: ${experiment_tag}
run_id: ${now:%Y%m%d-%H%M%S}
log_path: logs/train_unity/${experiment_tag}/${run_id}/fold_${train.fold}

